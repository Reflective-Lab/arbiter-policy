[workspace]
resolver = "2"
members = ["crates/arbiter"]

[workspace.package]
version = "2.0.1"
edition = "2024"
rust-version = "1.94.0"
license = "MIT"
repository = "https://github.com/Reflective-Lab/arbiter-policy"

[workspace.dependencies]
# Converge platform
converge-core = "3.9.1"
converge-pack = "3.9.1"

# Policy engine
cedar-policy = "4.10"
cedar-policy-symcc = "0.4"

# HTTP server
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1.48", features = ["full", "macros", "sync"] }
tower = "0.5"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# Common
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
regex = "1.11"

# Delegation tokens
ed25519-dalek = "2"
ciborium = "0.2"
base64 = "0.22"

# Dev
proptest = "1.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
similar_names = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_precision_loss = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
uninlined_format_args = "allow"
needless_pass_by_value = "allow"
unused_self = "allow"
wildcard_imports = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[patch.crates-io]
converge-pack         = { path = "../../bedrock-platform/converge/crates/pack" }
converge-kernel       = { path = "../../bedrock-platform/converge/crates/kernel" }
converge-core         = { path = "../../bedrock-platform/converge/crates/core" }
converge-model        = { path = "../../bedrock-platform/converge/crates/model" }
converge-optimization = { path = "../../bedrock-platform/converge/crates/optimization" }
converge-runtime      = { path = "../../bedrock-platform/converge/crates/runtime" }
converge-experience   = { path = "../../bedrock-platform/converge/crates/experience" }
converge-provider     = { path = "../../bedrock-platform/converge/crates/provider" }
organism-pack         = { path = "../../bedrock-platform/organism/crates/pack" }
organism-intent       = { path = "../../bedrock-platform/organism/crates/intent" }
organism-planning     = { path = "../../bedrock-platform/organism/crates/planning" }
organism-adversarial  = { path = "../../bedrock-platform/organism/crates/adversarial" }
organism-simulation   = { path = "../../bedrock-platform/organism/crates/simulation" }
organism-learning     = { path = "../../bedrock-platform/organism/crates/learning" }
organism-runtime      = { path = "../../bedrock-platform/organism/crates/runtime" }
organism-dynamics     = { path = "../../bedrock-platform/organism/crates/dynamics" }

