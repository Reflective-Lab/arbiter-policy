name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.96.0"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout Reflective sibling dependencies
        run: bash scripts/ci/checkout-reflective-siblings.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace
        run: cargo check --workspace --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - name: Checkout Reflective sibling dependencies
        run: bash scripts/ci/checkout-reflective-siblings.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace --all-targets

  analysis:
    name: Analysis (SymCC)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - name: Checkout Reflective sibling dependencies
        run: bash scripts/ci/checkout-reflective-siblings.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Run analysis-feature tests
        run: cargo test --workspace --all-targets --all-features

  analysis-cvc5:
    name: Analysis (CVC5 smoke)
    runs-on: ubuntu-latest
    needs: analysis
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - name: Checkout Reflective sibling dependencies
        run: bash scripts/ci/checkout-reflective-siblings.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Install CVC5
        run: |
          sudo apt-get update
          sudo apt-get install -y cvc5
      - name: Run ignored real-solver smoke
        run: cargo test --workspace --all-targets --all-features cvc5_smoke_reports_status_for_broad_expense_analysis -- --ignored --nocapture

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - name: Checkout Reflective sibling dependencies
        run: bash scripts/ci/checkout-reflective-siblings.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout Reflective sibling dependencies
        run: bash scripts/ci/checkout-reflective-siblings.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
